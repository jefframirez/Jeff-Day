<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeff's Day</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jeff's Day">
<meta name="theme-color" id="tcL" media="(prefers-color-scheme: light)" content="#f4f7f6">
<meta name="theme-color" id="tcD" media="(prefers-color-scheme: dark)" content="#101514">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420;9..144,560&family=Albert+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#f4f7f6; --surface:#ffffff; --ink:#25322f; --muted:#63736f;
    --faint:#96a3a0; --line:#e2eae7; --accent:#3e7c74; --accent-soft:#e3edeb;
    --amber:#a37c33; --amber-soft:#f3ead9; --rail:#d3ddda; --done:#7fa695;
    --kylee:#8b7fc7; --family:#c9a13c; --now:#2f7db8;
    --shadow:0 1px 3px rgba(38,58,54,.06),0 8px 24px rgba(38,58,54,.05);
    --lift:0 6px 24px rgba(38,58,54,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#101514; --surface:#1a2120; --ink:#e6edeb; --muted:#9db0ab;
      --faint:#6e807b; --line:#242e2c; --accent:#7dbcb2; --accent-soft:#202c2a;
      --amber:#d3a75f; --amber-soft:#2f2818; --rail:#2c3835; --done:#6f9c8b;
      --kylee:#a293e0; --family:#d8b45a; --now:#6aa9d8;
      --shadow:none; --lift:0 6px 24px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --ground:#101514; --surface:#1a2120; --ink:#e6edeb; --muted:#9db0ab;
    --faint:#6e807b; --line:#242e2c; --accent:#7dbcb2; --accent-soft:#202c2a;
    --amber:#d3a75f; --amber-soft:#2f2818; --rail:#2c3835; --done:#6f9c8b;
    --kylee:#a293e0; --family:#d8b45a; --now:#6aa9d8;
    --shadow:none; --lift:0 6px 24px rgba(0,0,0,.5);
  }
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"Albert Sans",system-ui,sans-serif; font-size:16px; line-height:1.4;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    min-height:100dvh;
  }
  .wrap{
    max-width:560px; margin:0 auto;
    padding:calc(28px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right))
            calc(56px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  }
  .titlerow{display:flex; align-items:flex-start; justify-content:space-between; gap:14px}
  .modebar{position:relative; flex:none; margin:-4px -6px 0 0; z-index:20}
  .gear{
    width:34px; height:34px; border-radius:50%; border:0; cursor:pointer;
    background:none; color:var(--faint);
    display:grid; place-items:center; padding:0;
  }
  .gear svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  .gear:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .mode{
    position:absolute; top:40px; right:0; display:none; flex-direction:column; gap:2px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--lift); padding:6px; min-width:130px;
  }
  .mode.open{display:flex}
  .mode .mlabel{
    font-size:.62rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:var(--faint); padding:4px 10px 2px;
  }
  .mode button{
    font:inherit; font-size:.8rem; font-weight:600; text-align:left;
    color:var(--muted); background:none; border:0; border-radius:8px; padding:7px 10px; cursor:pointer;
  }
  .mode button.on{background:var(--accent-soft); color:var(--accent)}
  .mode button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  header{padding:0 2px}
  header h1{
    font-family:"Fraunces",Georgia,serif; font-weight:560; font-size:1.8rem;
    margin:0 0 2px; letter-spacing:-.01em;
  }
  .sub{color:var(--muted); margin:0; font-size:.9rem}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0}
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    font-size:.74rem; font-weight:600; letter-spacing:.03em; color:var(--muted);
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--family)}
  .chip.warm .dot{background:var(--kylee)}
  .livewarn{
    margin:12px 0 0; padding:8px 11px; border-radius:9px;
    background:var(--amber-soft); color:var(--amber);
    font-size:.78rem; font-weight:600; line-height:1.35;
  }

  /* ---- timeline ---- */
  .board{position:relative; margin-top:30px}
  .edge{
    position:absolute; left:0; font-size:.66rem; font-weight:600; letter-spacing:.14em;
    color:var(--faint); font-variant-numeric:tabular-nums;
  }
  .edge::before{content:"—  "; letter-spacing:0}
  .rail-line{position:absolute; left:14px; top:14px; bottom:0; width:2.5px; border-radius:2px; background:var(--rail); opacity:.55}
  .bar{position:absolute; width:5px; border-radius:5px; z-index:2}
  .bar.mine{left:12.5px; background:var(--accent)}
  .bar.ctx{left:12.5px; background:var(--kylee)}
  .nowline{position:absolute; left:0; right:0; height:0; z-index:1; pointer-events:none}
  .nowline .ln{position:absolute; left:20px; right:0; top:0; border-top:1px solid var(--now); opacity:.3}
  .nowline em{
    position:absolute; left:0; top:-8px; font-style:normal; font-size:.6rem; font-weight:700;
    color:var(--now); font-variant-numeric:tabular-nums; letter-spacing:.02em;
    background:var(--ground); border-radius:4px; padding:1px 3px; line-height:1.25;
  }
  .nowline i{position:absolute; left:10.5px; top:-3.5px; width:7px; height:7px; border-radius:50%; background:var(--now)}
  /* daylight wash */
  .sky{position:fixed; inset:0; z-index:-1; opacity:0; transition:opacity 1.4s ease; pointer-events:none}
  .sky.on{opacity:1}
  .wxnote{
    font-size:.66rem; font-weight:600; letter-spacing:.04em; color:var(--faint);
    padding:0 10px 4px; margin-top:-3px;
  }
  .gap{
    position:absolute; left:42px; font-size:.68rem; font-weight:700; letter-spacing:.16em;
    color:var(--faint); text-transform:uppercase; pointer-events:none; opacity:.8;
  }
  .gap::before{content:"+  "}
  .titem{
    position:absolute; left:42px; right:0; z-index:3;
    display:flex; align-items:flex-start; gap:10px;
    touch-action:pan-y; cursor:grab; user-select:none; -webkit-user-select:none;
    padding:2px 0;
  }
  .titem .dot2{position:absolute; left:-32px; top:24px; width:11px; height:11px; border-radius:50%; background:var(--rail)}
  .titem.timed .dot2{background:var(--accent)}
  .titem .body{flex:1; min-width:0}
  .titem .when{font-size:.72rem; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; margin-bottom:1px}
  .titem .name{font-size:1.02rem; font-weight:600; letter-spacing:.01em}
  .titem.lift{opacity:.95}
  .titem.lift .name{color:var(--accent)}
  .check{
    width:24px; height:24px; border-radius:8px; border:0; background:var(--surface);
    box-shadow:inset 0 0 0 1.5px var(--rail);
    flex:none; margin-top:12px; display:grid; place-items:center; color:transparent;
    font-size:.8rem; cursor:pointer;
  }
  .titem.done{opacity:.5}
  .titem.done .check{background:var(--done); box-shadow:none; color:var(--surface)}
  .titem.done .name{text-decoration:line-through; color:var(--faint)}
  .titem.ctx{opacity:.7; pointer-events:none}
  .titem.ctx .dot2{background:var(--kylee)}
  .titem.ctx .name{font-weight:500}
  .titem.ctx .who{
    font-size:.62rem; font-weight:700; letter-spacing:.08em; color:var(--kylee);
    margin-left:7px; vertical-align:2px;
  }

  section.flat{margin-top:38px; padding:0 2px}
  h2{
    font-size:.7rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
    color:var(--faint); margin:0 0 10px;
  }
  .list{display:flex; flex-direction:column}
  .item{
    display:flex; align-items:center; gap:12px; padding:9px 0;
    cursor:pointer; user-select:none;
  }
  .item:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .box{
    width:22px; height:22px; border-radius:8px; background:var(--surface);
    box-shadow:inset 0 0 0 1.5px var(--rail);
    flex:none; display:grid; place-items:center; color:transparent; font-size:.8rem;
  }
  .item.done .box{background:var(--done); box-shadow:none; color:var(--surface)}
  .item.done .lab{color:var(--faint); text-decoration:line-through}
  .lab{font-size:.95rem; font-weight:600}
  .lab small{color:var(--faint); font-weight:400}
  .wl{padding:9px 0}
  .wl .name{font-size:.95rem; font-weight:600}
  .wl .tag{
    display:inline-block; font-size:.66rem; font-weight:700; letter-spacing:.05em;
    color:var(--amber); background:var(--amber-soft); border-radius:6px;
    padding:2px 7px; margin-left:8px; vertical-align:1px;
  }
  .wl p{margin:2px 0 0; font-size:.85rem; color:var(--muted)}
  footer{
    margin-top:44px; padding:16px 2px 0; border-top:1px solid var(--line);
    color:var(--faint); font-size:.8rem;
  }
  footer button{
    font:inherit; font-size:.78rem; font-weight:600; color:var(--accent);
    background:none; border:0; padding:0; cursor:pointer; text-decoration:underline;
  }
  @media (prefers-reduced-motion:no-preference){
    .wrap{animation:rise .5s ease both}
    @keyframes rise{from{opacity:0; transform:translateY(6px)}to{opacity:1}}
  }

  /* ---- add + edit (v8.29-16) ---- */
  .gap.tappable{pointer-events:auto; cursor:pointer}
  .gap.tappable:active{color:var(--accent)}
  .ghost{position:absolute; left:42px; right:0; height:0; display:none; z-index:6; pointer-events:none}
  .ghost::before{content:""; position:absolute; left:0; right:0; top:0; border-top:2px dashed var(--accent); opacity:.9}
  .ghost span{
    position:absolute; right:0; top:-11px; background:var(--accent); color:#fff;
    font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:7px;
    white-space:nowrap; font-variant-numeric:tabular-nums;
  }
  .fab{
    position:fixed; right:calc(18px + env(safe-area-inset-right));
    bottom:calc(22px + env(safe-area-inset-bottom));
    width:54px; height:54px; border-radius:50%; border:0; z-index:30;
    background:var(--accent); color:#fff; font-size:1.7rem; line-height:1;
    box-shadow:var(--lift); cursor:grab; touch-action:none;
    display:grid; place-items:center; padding:0 0 3px;
  }
  .fab.dragging{cursor:grabbing; opacity:.94}
  .fab:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  .scrim{position:fixed; inset:0; z-index:35; background:rgba(20,30,28,.28); display:none}
  .scrim.on{display:block}
  .composer{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--surface); border-top:1px solid var(--line);
    box-shadow:0 -8px 30px rgba(38,58,54,.14);
    padding:14px calc(16px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    transform:translateY(110%); transition:transform .22s ease; visibility:hidden;
  }
  .composer.open{transform:none; visibility:visible}
  .composer .crow{display:flex; gap:10px; align-items:center; margin-bottom:10px}
  .composer input[type=text], .composer select, .composer input[type=time]{
    font:inherit; font-size:1rem; font-weight:600; color:var(--ink);
    background:var(--ground); border:1px solid var(--line); border-radius:10px; padding:10px 12px;
  }
  .composer input[type=text]{flex:1; min-width:0}
  .composer select{flex:1; min-width:0}
  .composer .cbtns{display:flex; gap:10px; justify-content:flex-end}
  .composer button{
    font:inherit; font-size:.95rem; font-weight:700; border:0; border-radius:10px;
    padding:10px 20px; cursor:pointer;
  }
  #cAdd{background:var(--accent); color:#fff}
  #cAdd:disabled{opacity:.55}
  #cCancel{background:none; color:var(--muted)}
  input.edit{
    font:inherit; font-size:1rem; font-weight:600; color:var(--ink);
    background:var(--ground); border:1px solid var(--accent); border-radius:8px;
    padding:3px 7px; width:100%; box-sizing:border-box;
  }
  @media (prefers-reduced-motion:reduce){ .composer{transition:none} }
</style>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="sky" id="skyA"></div><div class="sky" id="skyB"></div>
<div class="wrap">
  <header>
    <div class="titlerow">
      <h1>Saturday, August&nbsp;29</h1>
      <div class="modebar">
        <button class="gear" id="gear" aria-label="Settings" aria-expanded="false">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.6a1.9 1.9 0 0 1 0-3.2l1-.66-1.5-2.6-1.14.44a1.9 1.9 0 0 1-2.6-1.1L14.7 4h-3l-.46 2.48a1.9 1.9 0 0 1-2.6 1.1L7.5 7.14l-1.5 2.6 1 .66a1.9 1.9 0 0 1 0 3.2l-1 .66 1.5 2.6 1.14-.44a1.9 1.9 0 0 1 2.6 1.1L11.7 20h3l.46-2.48a1.9 1.9 0 0 1 2.6-1.1l1.14.44 1.5-2.6z"/></svg>
        </button>
        <div class="mode" id="modemenu" role="group" aria-label="Appearance">
          <span class="mlabel">Appearance</span>
          <button data-mode="auto">Auto &middot; match device</button>
          <button data-mode="light">Light</button>
          <button data-mode="dark">Dark</button>
          <button data-mode="daylight">Daylight</button>
          <div class="wxnote" id="wxnote"></div>
        </div>
      </div>
    </div>
    <p class="sub">Sunny, high 84 &middot; heat advisory until 8pm</p>
    <div class="chips">
      <span class="chip"><span class="dot"></span>Kids day</span>
      <span class="chip warm"><span class="dot"></span>Kylee out 4:00&ndash;8:30</span>
    </div>
    <div class="livewarn" id="livewarn" hidden></div>
  </header>

  <div class="board" id="board"></div>

  <section class="flat">
    <h2>Anytime</h2>
    <div class="list" id="quick"></div>
  </section>

  <section class="flat">
    <h2>Watching</h2>
    <div class="wl">
      <span class="name">Flight to HNL</span><span class="tag">buy by Tue 9/1</span>
      <p>Waiting on Jessica about Sun 9/27.</p>
    </div>
  </section>

  <footer>
    Live from Todoist &middot; refreshes automatically. Checking a task off here closes it there too.
    <br><button id="reset">Put dragged rows back</button> &middot; v8.29-16
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<button class="fab" id="fab" aria-label="Add a task">+</button>
<div class="composer" id="composer" role="dialog" aria-label="New task">
  <div class="crow">
    <input type="text" id="cName" placeholder="What needs doing?" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
  </div>
  <div class="crow">
    <input type="time" id="cTime" step="900" aria-label="Time">
    <select id="cProj" aria-label="List"></select>
    <select id="cDur" aria-label="How long">
      <option value="15">15m</option>
      <option value="30" selected>30m</option>
      <option value="45">45m</option>
      <option value="60">1h</option>
      <option value="90">1h30</option>
      <option value="120">2h</option>
    </select>
  </div>
  <div class="cbtns">
    <button id="cCancel" type="button">Cancel</button>
    <button id="cAdd" type="button">Add</button>
  </div>
</div>
<script>
(function(){
  // ---------- appearance ----------
  var MKEY="jeffs-day-mode", root=document.documentElement;
  var mbtns=document.querySelectorAll(".mode button");
  var skyA=document.getElementById("skyA"), skyB=document.getElementById("skyB");
  var sunEl=document.getElementById("wxnote");
  var mode="auto";
  var LAT=34.1975, LON=-119.1771;

  // --- solar elevation (NOAA low-precision) ---
  function solarElevation(d){
    var rad=Math.PI/180;
    var n = d.getTime()/86400000 + 2440587.5 - 2451545.0;
    var L = (280.460 + 0.9856474*n) % 360;
    var g = ((357.528 + 0.9856003*n) % 360) * rad;
    var lam = (L + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) * rad;
    var eps = (23.439 - 0.0000004*n) * rad;
    var dec = Math.asin(Math.sin(eps)*Math.sin(lam));
    var ra  = Math.atan2(Math.cos(eps)*Math.sin(lam), Math.cos(lam));
    var gmst = (18.697374558 + 24.06570982441908*n) % 24; if(gmst<0)gmst+=24;
    var ha = gmst*15*rad + LON*rad - ra;
    var la = LAT*rad;
    return Math.asin(Math.sin(la)*Math.sin(dec) + Math.cos(la)*Math.cos(dec)*Math.cos(ha))/rad;
  }
  function sunTimes(day){
    var base=new Date(day.getFullYear(),day.getMonth(),day.getDate(),0,0,0);
    var prev=solarElevation(base), rise=null, set=null;
    for(var i=2;i<=1440;i+=2){
      var t=new Date(base.getTime()+i*60000), e=solarElevation(t);
      if(prev<-0.833&&e>=-0.833)rise=t;
      if(prev>=-0.833&&e<-0.833)set=t;
      prev=e;
    }
    return {rise:rise,set:set};
  }
  function clamp(v,a,b){return v<a?a:v>b?b:v;}
  function lerp(a,b,t){return a+(b-a)*t;}
  function mix(c1,c2,t){
    return "rgb("+Math.round(lerp(c1[0],c2[0],t))+","+Math.round(lerp(c1[1],c2[1],t))+","+Math.round(lerp(c1[2],c2[2],t))+")";
  }
  // three-stop so blue never passes through dead gray on its way to gold
  function mix3(a,m,b,t){
    return t<=.5 ? mix(a,m,t*2) : mix(m,b,(t-.5)*2);
  }
  function setSky(grad){
    if(!grad){skyA.classList.remove("on"); skyB.classList.remove("on"); return;}
    var showing=skyA.classList.contains("on")?skyA:skyB;
    var hidden=(showing===skyA)?skyB:skyA;
    hidden.style.background=grad;
    hidden.classList.add("on"); showing.classList.remove("on");
  }
  function clearSky(){
    ["--ground","--surface","--line"].forEach(function(t){root.style.removeProperty(t)});
    setSky(null); setBarTint(null);
  }
  var tcL=document.getElementById("tcL"), tcD=document.getElementById("tcD");
  function setBarTint(c){
    if(tcL)tcL.setAttribute("content", c||"#f4f7f6");
    if(tcD)tcD.setAttribute("content", c||"#101514");
  }

  // day anchors: sun high (cool) -> sun low (warm)
  var HI_TOP=[206,228,242], MD_TOP=[240,231,213], LO_TOP=[248,220,194];
  var HI_BOT=[244,247,250], MD_BOT=[250,248,243], LO_BOT=[252,246,239];
  var HI_SURF=[253,254,255], LO_SURF=[255,253,250];
  var HI_LINE=[224,233,238], MD_LINE=[235,230,220], LO_LINE=[240,228,215];
  // night anchors: just after sunset (violet) -> deep night (blue-black)
  var DK_TOP=[40,36,56],  NT_TOP=[18,22,34];
  var DK_BOT=[21,20,28],  NT_BOT=[10,12,17];
  var DK_SURF=[31,30,40], NT_SURF=[22,25,32];
  var DK_LINE=[43,41,54], NT_LINE=[33,37,45];

  function fmtT(d){
    if(!d)return "";
    var h=d.getHours(), m=d.getMinutes(), ap=h>=12?"PM":"AM"; h=h%12; if(h===0)h=12;
    return h+":"+(m<10?"0":"")+m+" "+ap;
  }
  var st=null, stDay=null;
  function times(now){
    var key=now.toDateString();
    if(stDay!==key){st=sunTimes(now); stDay=key;}
    return st;
  }
  function paintDaylight(){
    var now=new Date();
    var elev=solarElevation(now);
    var dark = elev < -2;
    root.setAttribute("data-theme", dark?"dark":"light");
    var top,bot,surf,line;
    if(!dark){
      // warmth: 0 when sun is high, 1 at the horizon
      var w=clamp((20-elev)/22, 0, 1);
      w=w*w*(3-2*w); // ease
      top=mix3(HI_TOP,MD_TOP,LO_TOP,w); bot=mix3(HI_BOT,MD_BOT,LO_BOT,w);
      surf=mix(HI_SURF,LO_SURF,w); line=mix3(HI_LINE,MD_LINE,LO_LINE,w);
    }else{
      var d=clamp((-elev-2)/14, 0, 1);
      d=d*d*(3-2*d);
      top=mix(DK_TOP,NT_TOP,d); bot=mix(DK_BOT,NT_BOT,d);
      surf=mix(DK_SURF,NT_SURF,d); line=mix(DK_LINE,NT_LINE,d);
    }
    setSky("linear-gradient(180deg,"+top+" 0%,"+bot+" 55%,"+bot+" 100%)");
    root.style.setProperty("--ground",bot);
    root.style.setProperty("--surface",surf);
    root.style.setProperty("--line",line);
    setBarTint(top);
    updateSunNote(now,elev);
  }
  function updateSunNote(now,elev){
    if(!sunEl)return;
    var t=times(now||new Date());
    var e=(elev===undefined)?solarElevation(now||new Date()):elev;
    sunEl.textContent = (e>=-2 ? "sunset "+fmtT(t.set) : "sunrise "+fmtT(t.rise));
  }
  function applyMode(m){
    mode=(m==="light"||m==="dark"||m==="daylight")?m:"auto";
    mbtns.forEach(function(b){b.classList.toggle("on",b.dataset.mode===mode);});
    if(mode==="light"||mode==="dark"){root.setAttribute("data-theme",mode); clearSky();}
    else if(mode==="auto"){root.removeAttribute("data-theme"); clearSky();}
    else {paintDaylight();}
  }
  try{mode=localStorage.getItem(MKEY)||"auto"}catch(e){}
  if(mode==="weather")mode="daylight";
  applyMode(mode);
  updateSunNote();
  setInterval(function(){ if(mode==="daylight")paintDaylight(); },90*1000);
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden && mode==="daylight")paintDaylight();
  });
  var gear=document.getElementById("gear"), menu=document.getElementById("modemenu");
  function closeMenu(){menu.classList.remove("open"); gear.setAttribute("aria-expanded","false");}
  gear.addEventListener("click",function(e){
    e.stopPropagation();
    menu.classList.toggle("open");
    gear.setAttribute("aria-expanded",menu.classList.contains("open")?"true":"false");
  });
  document.addEventListener("click",function(e){
    if(menu.classList.contains("open")&&!menu.contains(e.target))closeMenu();
  });
  mbtns.forEach(function(b){b.addEventListener("click",function(){
    applyMode(b.dataset.mode); try{localStorage.setItem(MKEY,b.dataset.mode)}catch(e){}
    closeMenu();
  });});

  // ---------- data ----------
  var DAY="2026-08-29";
  var START=7*60, END=23*60, PPM=1.05;
  var OKEY="jd2-overrides-"+DAY, DKEY="jd2-done-"+DAY, CKEY="jd2-cache-"+DAY;
  var overrides={}, done={};
  try{overrides=JSON.parse(localStorage.getItem(OKEY))||{}}catch(e){}
  try{done=JSON.parse(localStorage.getItem(DKEY))||{}}catch(e){}

  // ---------- real Todoist sync ----------
  var WORKER="https://jeffs-day-worker.jeffnramirez.workers.dev", APPKEY="XwPNlNvuavBom1QxjvPkd9vnbvd2S_uk";
  function syncTodoist(ids,isDone){
    if(!ids||!ids.length)return;
    try{
      fetch(WORKER+(isDone?"/complete":"/reopen"),{
        method:"POST",
        headers:{"Content-Type":"application/json","X-App-Key":APPKEY},
        body:JSON.stringify({ids:ids})
      }).catch(function(e){console.error("todoist sync failed",e);});
    }catch(e){console.error("todoist sync failed",e);}
  }

  // Kylee/Ryder blocks come from Apple Calendar, not Todoist — Cathy still seeds these per day.
  var ctxItems=[
    {id:"walk", type:"ctx", start:16*60,    dur:120, bar:true, name:"Walk w Stacey"},
    {id:"movie",type:"ctx", start:18*60+30, dur:120, bar:true, name:"Movie w Stacey & Graci"}
  ];

  // task-type rows are pulled live from Todoist below
  var items=[], liveTimed=[], liveAnytime=[];

  var board=document.getElementById("board");
  var quickList=document.getElementById("quick");
  var e1,e2,nl;
  function y(min){return (min-START)*PPM+14;}
  function nowMin(){
    if(today()!==DAY)return null;
    var d=new Date(); return d.getHours()*60+d.getMinutes();
  }
  function edgeLabel(min){
    var h=Math.floor(min/60)%24, m=min%60, ap=h>=12?"PM":"AM", hh=h%12;
    if(hh===0)hh=12;
    return hh+(m?":"+(m<10?"0":"")+m:"")+" "+ap;
  }
  // Collapse dead space: begin at the earliest thing still on the board (or now,
  // whichever is earlier) and end a little past the last one. As the day burns off
  // and finished tasks drop out of Todoist, the top of the rail closes up by itself.
  function recomputeSpan(){
    var now=nowMin(), starts=[], ends=[];
    items.forEach(function(it){ starts.push(it.start); ends.push(it.start+it.dur); });
    var first=starts.length?Math.min.apply(null,starts):(now!=null?now:7*60);
    var last =ends.length  ?Math.max.apply(null,ends)  :(now!=null?now:23*60);
    if(now!=null){ first=Math.min(first,now); last=Math.max(last,now); }
    START=Math.max(0,Math.floor((first-20)/60)*60);
    END=Math.min(24*60,Math.max(START+120,Math.ceil((last+30)/60)*60));
  }
  function fmt(min){
    var h=Math.floor(min/60), m=min%60, ap=h>=12?"PM":"AM";
    var hh=h%12; if(hh===0)hh=12;
    return hh+":"+(m<10?"0":"")+m+" "+ap;
  }
  function fmtDur(min){
    var h=Math.floor(min/60), m=min%60, s="";
    if(h)s+=h+"H "; if(m)s+=m+"M";
    return s.trim();
  }
  function timeToMinutes(iso){
    var d=new Date(iso);
    return d.getHours()*60+d.getMinutes();
  }
  function buildTaskItem(t){
    var dur=t.durationMin||20;
    return {id:"td-"+t.id, type:"task", start:timeToMinutes(t.due), dur:dur, bar:dur>=45, name:t.content, tid:[t.id]};
  }

  function renderItemEl(it){
    if(it.bar){
      it.barEl=document.createElement("div");
      it.barEl.className="bar "+(it.type==="ctx"?"ctx":"mine");
      board.appendChild(it.barEl);
    }
    var el=document.createElement("div");
    el.className="titem "+(it.type==="ctx"?"ctx":"timed")+(done[it.id]?" done":"");
    el.innerHTML='<span class="dot2"></span><div class="body"><div class="when"></div><div class="name"></div></div>'+(it.type==="ctx"?"":'<button class="check" aria-label="done">✓</button>');
    var nameEl=el.querySelector(".name");
    nameEl.textContent=it.name;
    if(it.type==="ctx"){
      var who=document.createElement("span"); who.className="who"; who.textContent="KYLEE";
      nameEl.appendChild(who);
    }else{
      var c=el.querySelector(".check");
      c.addEventListener("click",function(ev){
        ev.stopPropagation();
        el.classList.toggle("done");
        var isDone=el.classList.contains("done");
        done[it.id]=isDone;
        try{localStorage.setItem(DKEY,JSON.stringify(done))}catch(e){}
        syncTodoist(it.tid,isDone);
      });
      c.addEventListener("pointerdown",function(ev){ev.stopPropagation();});
      makeDraggable(el,it);
      wireTitleEdit(nameEl,it);
    }
    it.el=el; board.appendChild(el);
  }

  function renderAnytimeEl(t){
    var el=document.createElement("div");
    el.className="item"+(done["td-"+t.id]?" done":"");
    el.tabIndex=0;
    el.innerHTML='<span class="box">&#10003;</span><span class="lab"></span>';
    el.querySelector(".lab").textContent=t.content;
    function flip(){
      el.classList.toggle("done");
      var isDone=el.classList.contains("done");
      done["td-"+t.id]=isDone;
      try{localStorage.setItem(DKEY,JSON.stringify(done))}catch(e){}
      syncTodoist([t.id],isDone);
    }
    var boxEl=el.querySelector(".box"), labEl=el.querySelector(".lab");
    boxEl.addEventListener("click",function(ev){ev.stopPropagation();flip();});
    labEl.addEventListener("click",function(ev){
      ev.stopPropagation();
      startEdit(labEl,t.content,function(next){
        t.content=next; labEl.textContent=next; pushRename(t.id,next);
      });
    });
    el.addEventListener("keydown",function(e){if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}});
    quickList.appendChild(el);
  }

  var gapEls=[];
  function layout(){
    if(e1)e1.textContent=edgeLabel(START);
    if(e2)e2.textContent=edgeLabel(END);
    // bars + when labels at true time
    items.forEach(function(it){
      var w=it.el.querySelector(".when");
      w.textContent=(it.dur>=45)?fmt(it.start)+" – "+fmt(it.start+it.dur):fmt(it.start);
      if(it.barEl){
        it.barEl.style.top=(y(it.start)+3)+"px";
        it.barEl.style.height=Math.max(20,it.dur*PPM-6)+"px";
      }
    });
    // text rows: proportional, but pushed down so nothing overlaps
    var sorted=items.slice().sort(function(a,b){return a.start-b.start||(a.type==="ctx")-(b.type==="ctx");});
    var cursor=-1e9;
    sorted.forEach(function(it){
      var top=Math.max(y(it.start)-6, cursor);
      it.el.style.top=top+"px";
      it.top=top;
      cursor=top+(it.el.offsetHeight||44)+6;
    });
    var bottom=Math.max(y(END), cursor);
    board.style.height=(bottom+26)+"px";
    e2.style.top=(bottom+4)+"px";
    // open gaps between MY commitments
    gapEls.forEach(function(g){g.remove()}); gapEls=[];
    var mine=items.filter(function(i){return i.type!=="ctx"}).slice().sort(function(a,b){return a.start-b.start});
    var edges=[], cur=START;
    mine.forEach(function(i){
      if(i.start-cur>=60)edges.push([cur,i.start]);
      cur=Math.max(cur,i.start+i.dur);
    });
    if(END-cur>=60)edges.push([cur,END]);
    edges.forEach(function(e){
      var mid=y((e[0]+e[1])/2);
      var clash=sorted.some(function(it){return mid>it.top-14&&mid<it.top+((it.el.offsetHeight||44));});
      if(clash)return;
      var g=document.createElement("div");
      g.className="gap tappable"; g.textContent=fmtDur(e[1]-e[0])+" open";
      g.style.top=(mid-8)+"px";
      g.dataset.min=snap(e[0]+15);
      g.addEventListener("click",function(){openComposer(parseInt(g.dataset.min,10));});
      board.appendChild(g); gapEls.push(g);
    });
    tick();
  }

  function today(){
    var d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function tick(){
    if(!nl)return;
    if(today()!==DAY){nl.style.display="none";return;}
    var d=new Date(), m=d.getHours()*60+d.getMinutes();
    if(m<START||m>END){nl.style.display="none";return;}
    nl.style.display="block"; nl.style.top=y(m)+"px";
    nl.querySelector("em").textContent=fmt(m).replace(/ [AP]M$/,"");
  }
  setInterval(tick,30000);

  // ---------- drag ----------
  var lifted=null;
  document.addEventListener("touchmove",function(e){ if(lifted)e.preventDefault(); },{passive:false});
  function snap(min){return Math.round(min/15)*15;}
  function makeDraggable(el,it){
    el.addEventListener("pointerdown",function(e){
      if(e.button)return;
      var startY=e.clientY, origStart=it.start, timer=null, active=false, moved=false;
      if(e.pointerType==="mouse"){lift();}
      else{timer=setTimeout(lift,320);}
      function lift(){
        active=true; lifted=el; el.classList.add("lift");
        try{el.setPointerCapture(e.pointerId)}catch(err){}
      }
      function onMove(ev){
        var dy=ev.clientY-startY;
        if(!active){
          if(Math.abs(dy)>10){clearTimeout(timer); cleanup();}
          return;
        }
        moved=true;
        var ns=snap(origStart+dy/PPM);
        ns=Math.max(START,Math.min(END-it.dur,ns));
        if(ns!==it.start){it.start=ns; layout();}
      }
      function onUp(){
        clearTimeout(timer);
        if(active){
          el.classList.remove("lift"); lifted=null;
          if(moved){
            justDragged=Date.now();
            overrides[it.id]=it.start;
            try{localStorage.setItem(OKEY,JSON.stringify(overrides))}catch(e2){}
          }
          layout();
        }
        cleanup();
      }
      function cleanup(){
        document.removeEventListener("pointermove",onMove);
        document.removeEventListener("pointerup",onUp);
        document.removeEventListener("pointercancel",onUp);
      }
      document.addEventListener("pointermove",onMove);
      document.addEventListener("pointerup",onUp);
      document.addEventListener("pointercancel",onUp);
    });
  }

  document.getElementById("reset").addEventListener("click",function(){
    try{localStorage.removeItem(OKEY)}catch(e){}
    location.reload();
  });

  // ---------- render + live fetch ----------
  function render(){
    board.innerHTML=""; quickList.innerHTML="";
    var rl=document.createElement("div"); rl.className="rail-line"; board.appendChild(rl);
    e1=document.createElement("div"); e1.className="edge"; e1.textContent="7 AM"; e1.style.top="0px"; board.appendChild(e1);
    e2=document.createElement("div"); e2.className="edge"; e2.textContent="11 PM"; board.appendChild(e2);
    nl=document.createElement("div"); nl.className="nowline"; nl.innerHTML='<i></i><em></em><span class="ln"></span>'; board.appendChild(nl);
    gh=document.createElement("div"); gh.className="ghost"; gh.innerHTML="<span></span>"; board.appendChild(gh);

    items=ctxItems.concat(liveTimed);
    items.forEach(function(it){ if(overrides[it.id]!=null) it.start=overrides[it.id]; });
    recomputeSpan();
    items.forEach(renderItemEl);
    liveAnytime.forEach(renderAnytimeEl);

    layout();
  }

  function applyTasks(tasks){
    liveTimed=[]; liveAnytime=[];
    tasks.forEach(function(t){
      if(t.allDay) liveAnytime.push(t); else liveTimed.push(buildTaskItem(t));
    });
    render();
  }

  var warnEl=document.getElementById("livewarn");
  function warn(msg){
    if(!warnEl)return;
    if(!msg){warnEl.hidden=true; warnEl.textContent=""; return;}
    warnEl.hidden=false; warnEl.textContent=msg;
  }

  function fetchToday(){
    fetch(WORKER+"/today?date="+DAY,{headers:{"X-App-Key":APPKEY}})
      .then(function(r){
        return r.text().then(function(txt){
          if(!r.ok)throw new Error("Todoist link returned "+r.status+" — "+txt.slice(0,140));
          try{return JSON.parse(txt)}catch(e){throw new Error("bad response from the Todoist link");}
        });
      })
      .then(function(data){
        var tasks=data.tasks||[];
        try{localStorage.setItem(CKEY,JSON.stringify(tasks))}catch(e){}
        warn(null);
        applyTasks(tasks);
      })
      .catch(function(e){
        console.error("live fetch failed",e);
        warn("Not live right now: "+(e.message||e)+". Showing the last version I had.");
      });
  }

  var cached=null;
  try{cached=JSON.parse(localStorage.getItem(CKEY))}catch(e){}
  if(cached){ applyTasks(cached); } else { render(); }
  fetchToday();
  setInterval(fetchToday, 3*60*1000);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) fetchToday(); });


  // ---------- add + edit (v8.29-16) ----------
  var PKEY="jd2-projects", LPKEY="jd2-lastproj";
  var projects=[], justDragged=0, gh=null, composeMin=null;
  try{projects=JSON.parse(localStorage.getItem(PKEY))||[]}catch(e){}

  var scrim=document.getElementById("scrim");
  var fab=document.getElementById("fab");
  var composer=document.getElementById("composer");
  var cName=document.getElementById("cName");
  var cTime=document.getElementById("cTime");
  var cProj=document.getElementById("cProj");
  var cDur=document.getElementById("cDur");
  var cAdd=document.getElementById("cAdd");
  var cCancel=document.getElementById("cCancel");

  function pad2(n){return (n<10?"0":"")+n;}
  function offsetStr(){
    var o=-new Date().getTimezoneOffset(), s=o>=0?"+":"-"; o=Math.abs(o);
    return s+pad2(Math.floor(o/60))+":"+pad2(o%60);
  }
  function dueStamp(min){
    return DAY+"T"+pad2(Math.floor(min/60))+":"+pad2(min%60)+":00"+offsetStr();
  }

  // ---- list picker ----
  function fillProjectSelect(){
    if(!cProj)return;
    var last=null; try{last=localStorage.getItem(LPKEY)}catch(e){}
    cProj.innerHTML="";
    if(!projects.length){
      var o=document.createElement("option");
      o.value=""; o.textContent="Lists unavailable";
      cProj.appendChild(o); return;
    }
    projects.forEach(function(p){
      var op=document.createElement("option");
      op.value=p.id; op.textContent=p.name;
      cProj.appendChild(op);
    });
    if(last){
      var hit=projects.some(function(p){return p.id===last;});
      if(hit)cProj.value=last;
    }
  }
  function fetchProjects(){
    fetch(WORKER+"/projects",{headers:{"X-App-Key":APPKEY}})
      .then(function(r){
        if(!r.ok)throw new Error("list lookup returned "+r.status);
        return r.json();
      })
      .then(function(d){
        projects=d.projects||[];
        try{localStorage.setItem(PKEY,JSON.stringify(projects))}catch(e){}
        fillProjectSelect();
      })
      .catch(function(e){
        console.error("project list failed",e);
        if(!projects.length)warn("Can't reach your lists right now, so adding is off until it comes back.");
      });
  }

  // ---- composer ----
  function openComposer(min){
    composeMin=Math.max(START,Math.min(END-15,snap(min)));
    cTime.value=pad2(Math.floor(composeMin/60))+":"+pad2(composeMin%60);
    cName.value="";
    fillProjectSelect();
    composer.classList.add("open");
    scrim.classList.add("on");
    setTimeout(function(){try{cName.focus()}catch(e){}},60);
  }
  function closeComposer(){
    composer.classList.remove("open");
    scrim.classList.remove("on");
    try{cName.blur()}catch(e){}
  }
  function nextSlot(){
    var m=START;
    if(today()===DAY){var d=new Date(); m=d.getHours()*60+d.getMinutes()+15;}
    return Math.max(START,Math.min(END-15,snap(m)));
  }
  function addTask(){
    var name=cName.value.trim();
    if(!name){try{cName.focus()}catch(e){} return;}
    var pid=cProj.value;
    if(!pid){warn("No list to put it in yet. Try again in a moment.");return;}
    try{localStorage.setItem(LPKEY,pid)}catch(e){}
    cAdd.disabled=true; cAdd.textContent="Adding";
    fetch(WORKER+"/add",{
      method:"POST",
      headers:{"Content-Type":"application/json","X-App-Key":APPKEY},
      body:JSON.stringify({
        content:name,
        due:dueStamp(composeMin),
        projectId:pid,
        durationMin:parseInt(cDur.value,10)||30
      })
    })
    .then(function(r){
      return r.text().then(function(txt){
        if(!r.ok)throw new Error("Todoist said "+r.status+" — "+txt.slice(0,120));
        return txt;
      });
    })
    .then(function(){ warn(null); closeComposer(); fetchToday(); })
    .catch(function(e){ warn("Couldn't add that: "+(e.message||e)); })
    .then(function(){ cAdd.disabled=false; cAdd.textContent="Add"; });
  }

  cTime.addEventListener("change",function(){
    var p=cTime.value.split(":");
    if(p.length===2){
      var m=(parseInt(p[0],10)*60)+parseInt(p[1],10);
      if(!isNaN(m))composeMin=m;
    }
  });
  cName.addEventListener("keydown",function(e){
    if(e.key==="Enter"){e.preventDefault(); addTask();}
    else if(e.key==="Escape"){e.preventDefault(); closeComposer();}
  });
  cAdd.addEventListener("click",addTask);
  cCancel.addEventListener("click",closeComposer);
  scrim.addEventListener("click",closeComposer);

  // ---- draggable plus ----
  function minFromClientY(cy){
    var r=board.getBoundingClientRect();
    return snap((cy-r.top-14)/PPM+START);
  }
  fab.addEventListener("pointerdown",function(e){
    if(e.button)return;
    var sy=e.clientY, dragging=false, dropMin=null;
    try{fab.setPointerCapture(e.pointerId)}catch(err){}
    function mv(ev){
      if(!dragging&&Math.abs(ev.clientY-sy)<8)return;
      dragging=true;
      fab.classList.add("dragging");
      fab.style.transform="translateY("+(ev.clientY-sy)+"px)";
      dropMin=Math.max(START,Math.min(END-15,minFromClientY(ev.clientY)));
      if(gh){
        gh.style.display="block";
        gh.style.top=(y(dropMin)-1)+"px";
        gh.firstChild.textContent=fmt(dropMin);
      }
    }
    function up(){
      document.removeEventListener("pointermove",mv);
      document.removeEventListener("pointerup",up);
      document.removeEventListener("pointercancel",up);
      fab.classList.remove("dragging");
      fab.style.transform="";
      if(gh)gh.style.display="none";
      openComposer(dragging&&dropMin!=null?dropMin:nextSlot());
    }
    document.addEventListener("pointermove",mv);
    document.addEventListener("pointerup",up);
    document.addEventListener("pointercancel",up);
  });

  // ---- edit a title in place ----
  function startEdit(host,text,commit){
    if(host.querySelector("input"))return;
    var prev=host.innerHTML, finished=false;
    var inp=document.createElement("input");
    inp.type="text"; inp.className="edit"; inp.value=text;
    inp.setAttribute("autocomplete","off");
    inp.setAttribute("enterkeyhint","done");
    host.innerHTML=""; host.appendChild(inp);
    try{inp.focus(); inp.setSelectionRange(text.length,text.length);}catch(e){}
    function finish(save){
      if(finished)return; finished=true;
      var next=inp.value.trim();
      host.innerHTML=prev;
      if(save&&next&&next!==text)commit(next,host);
    }
    inp.addEventListener("keydown",function(e){
      e.stopPropagation();
      if(e.key==="Enter"){e.preventDefault(); finish(true);}
      else if(e.key==="Escape"){e.preventDefault(); finish(false);}
    });
    inp.addEventListener("blur",function(){finish(true);});
    inp.addEventListener("pointerdown",function(e){e.stopPropagation();});
    inp.addEventListener("click",function(e){e.stopPropagation();});
  }
  function pushRename(id,text){
    fetch(WORKER+"/rename",{
      method:"POST",
      headers:{"Content-Type":"application/json","X-App-Key":APPKEY},
      body:JSON.stringify({id:id,content:text})
    })
    .then(function(r){
      if(!r.ok)throw new Error("Todoist said "+r.status);
      warn(null);
    })
    .catch(function(e){
      warn("Couldn't rename that: "+(e.message||e)+". Putting the old title back.");
      fetchToday();
    });
  }
  function wireTitleEdit(nameEl,it){
    nameEl.addEventListener("click",function(ev){
      if(Date.now()-justDragged<400)return;
      ev.stopPropagation();
      startEdit(nameEl,it.name,function(next){
        it.name=next;
        nameEl.textContent=next;
        pushRename(it.tid&&it.tid[0]?it.tid[0]:String(it.id).replace(/^td-/,""),next);
      });
    });
  }

  fillProjectSelect();
  fetchProjects();

  window.addEventListener("resize",layout);
})();
</script>
